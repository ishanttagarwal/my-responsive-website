<script>
    function routeDevice() {
        // 1. Check the actual inner width of the browser window
        var isSmallScreen = window.innerWidth <= 768;
        
        // 2. Check if the device naturally uses touch/mobile identifiers
        var isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Redirect based on the findings
        if (isMobileDevice || isSmallScreen) {
            window.location.href = "mobile/website_mobile/index.html";
        } else {
            window.location.href = "desktop/website/index.html";
        }
    }

    // Run the routing function immediately when the page loads
    window.onload = routeDevice;
</script>
